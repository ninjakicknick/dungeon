<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090706"><title>Dungeon</title></head><body><main id="app"><section class="playfield"><canvas id="game" width="160" height="120" aria-label="Dungeon view"></canvas><aside class="map-panel"><div class="map-head"><span>MAP</span><span id="key-status" hidden>KEY</span></div><canvas id="map" width="60" height="55" aria-label="Explored dungeon map"></canvas></aside></section><p id="message" class="message" aria-live="polite"></p><section id="encounter" class="encounter" hidden><div class="encounter-head"><strong>SKELETON</strong><span id="warden-hp">◆ ◆ ◆ ◆</span></div><div id="roll" class="roll">REACH · its first attack comes before yours</div><div class="encounter-actions"><button class="combat-icon strike" data-combat="strike"><span>STRIKE</span></button><button class="combat-icon guard" data-combat="guard"><span>GUARD</span></button><button class="combat-icon flee" data-combat="flee"><span>FLEE</span></button></div></section><section class="party" aria-label="Adventuring party">
<div class="hero"><strong>BRAM</strong><span>WARRIOR · L1</span><b id="life-bram">♥ 7/7</b></div>
<div class="hero"><strong>MARA</strong><span>CLERIC · L1</span><b id="life-mara">♥ 5/5</b></div>
<div class="hero"><strong>NIX</strong><span>ROGUE · L1</span><b id="life-nix">♥ 4/4</b></div>
<div class="hero"><strong>ELARA</strong><span>WIZARD · L1</span><b id="life-elara">♥ 3/3</b></div>
</section><button id="interact" class="interact" data-action="interact" hidden>EXAMINE</button><div class="controls" aria-label="Movement controls"><button data-action="left" aria-label="Turn left">↶</button><button data-action="forward" aria-label="Move forward">▲</button><button data-action="right" aria-label="Turn right">↷</button><button data-action="back" aria-label="Move backward">▼</button></div><p class="hint">WASD / arrows · E to interact</p></main><script type="module" src="/src/main.ts"></script></body></html>
