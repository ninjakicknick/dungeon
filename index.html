<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090706"><title>Dungeon</title></head>
<body>
<main id="app">
<section class="playfield">
<canvas id="game" width="160" height="120" aria-label="Dungeon view"></canvas>
<aside class="map-panel"><span>MAP</span><canvas id="map" width="64" height="64" aria-label="Explored dungeon map"></canvas></aside>
</section>
<p id="message" class="message" aria-live="polite"></p>
<div class="controls" aria-label="Movement controls">
<button data-action="left" aria-label="Turn left">↶</button><button data-action="forward" aria-label="Move forward">▲</button><button data-action="right" aria-label="Turn right">↷</button><button data-action="back" aria-label="Move backward">▼</button>
</div>
<p class="hint">WASD / arrows · explore the first floor</p>
</main>
<script type="module" src="/src/main.ts"></script>
</body></html>
