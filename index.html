<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090706"><title>Dungeon</title></head><body><main id="app"><section class="playfield"><canvas id="game" width="160" height="120" aria-label="Dungeon view"></canvas><aside class="map-panel"><div class="map-head"><span>MAP</span><span id="key-status" hidden>KEY</span></div><canvas id="map" width="60" height="55" aria-label="Explored dungeon map"></canvas></aside></section><p id="message" class="message" aria-live="polite"></p><section id="encounter" class="encounter" hidden><div class="encounter-head"><strong>SKELETON</strong><em id="battle-space">CORRIDOR</em><span id="warden-hp">◆ ◆ ◆ ◆</span></div><div id="roll" class="roll">Choose a hero. Each acts once before the foe.</div><div class="encounter-actions party-actions"><button data-hero="0">BRAM<small>+1</small></button><button data-hero="1">MARA<small>+1 UNDEAD</small></button><button data-hero="2">NIX<small>+0</small></button><button data-hero="3">ELARA<small>-1</small></button></div><div id="wizard-actions" class="wizard-actions" hidden><button data-spell="lightning">LIGHTNING<small id="spell-lightning">1</small></button><button data-spell="fireball">FIREBALL<small id="spell-fireball">1</small></button><button data-spell="protection">PROTECT<small id="spell-protection">1</small></button><button data-spell="cancel">BACK</button></div></section><section class="party" aria-label="Adventuring party">
<div class="hero" data-party-index="0"><i>1</i><strong>BRAM</strong><span>WARRIOR · L1</span><b id="life-bram">♥ 7/7</b></div>
<div class="hero" data-party-index="1"><i>2</i><strong>MARA</strong><span>CLERIC · L1</span><b id="life-mara">♥ 5/5</b></div>
<div class="hero" data-party-index="2"><i>3</i><strong>NIX</strong><span>ROGUE · L1</span><b id="life-nix">♥ 4/4</b></div>
<div class="hero" data-party-index="3"><i>4</i><strong>ELARA</strong><span>WIZARD · L1</span><b id="life-elara">♥ 3/3 · ✦ <span id="elara-spells">3</span></b></div>
</section><button id="interact" class="interact" data-action="interact" hidden>EXAMINE</button><div class="controls" aria-label="Movement controls"><button data-action="left" aria-label="Turn left">↶</button><button data-action="forward" aria-label="Move forward">▲</button><button data-action="right" aria-label="Turn right">↷</button><button data-action="back" aria-label="Move backward">▼</button></div><p class="hint">WASD / arrows · E to interact</p></main><script type="module" src="/src/main.ts"></script></body></html>
