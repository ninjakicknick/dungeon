<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090706">
  <title>Dungeon · Room Scene Prototype</title>
</head>
<body>
  <main id="app">
    <header class="scene-head"><span>DUNGEON</span><span>ROOM-SCENE PROTOTYPE</span></header>
    <section class="scene" aria-label="Dungeon room">
      <img class="room" src="/assets/room-scenes/dungeon01.png" alt="">
      <button id="rear-exit" class="exit rear" aria-label="Rear door">
        <span class="door-sprite"></span><em>ENTER</em>
      </button>
      <button id="left-exit" class="exit left" aria-label="Left door">
        <span class="door-sprite"></span><em>ENTER</em>
      </button>
      <button id="right-exit" class="exit right" aria-label="Right door">
        <span class="door-sprite"></span><em>ENTER</em>
      </button>
      <div class="vignette"></div>
    </section>
    <p id="message" class="message" aria-live="polite">Three exits break the silence. Choose a door.</p>
    <section class="party">
      <div><strong>BRAM</strong><span>WARRIOR · ♥ 7/7</span></div>
      <div><strong>MARA</strong><span>CLERIC · ♥ 5/5</span></div>
      <div><strong>NIX</strong><span>ROGUE · ♥ 4/4</span></div>
      <div><strong>ELARA</strong><span>WIZARD · ♥ 3/3</span></div>
    </section>
    <p class="hint">Proof of concept · one room = one screen · click a door</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
