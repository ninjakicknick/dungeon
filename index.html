<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090706"><title>Dungeon</title></head>
<body>
<main id="app">
  <header class="scene-head"><span>DUNGEON</span><span id="room-label">ROOM 1</span><button id="map-button" type="button">MAP</button></header>
  <section class="scene" aria-label="Dungeon room">
    <img class="room" src="/assets/room-scenes/dungeon01.png" alt="">
    <button data-exit="rear" class="exit rear" aria-label="Rear door"><img class="door-art" src="/assets/room-overlays/door-back.png" alt=""><em>ENTER</em></button>
    <button data-exit="left" class="exit left" aria-label="Left door"><img class="door-art" src="/assets/room-overlays/door-side.png" alt=""><em>ENTER</em></button>
    <button data-exit="right" class="exit right" aria-label="Right door"><img class="door-art" src="/assets/room-overlays/door-side.png" alt=""><em>ENTER</em></button>
    <div id="room-feature" class="room-feature" aria-hidden="true"></div><div class="vignette"></div>
  </section>
  <p id="message" class="message" aria-live="polite"></p>
  <section class="party"><div><strong>BRAM</strong><span>WARRIOR · ♥ 7/7</span></div><div><strong>MARA</strong><span>CLERIC · ♥ 5/5</span></div><div><strong>NIX</strong><span>ROGUE · ♥ 4/4</span></div><div><strong>ELARA</strong><span>WIZARD · ♥ 3/3</span></div></section>
</main>
<dialog id="map-dialog"><header><strong>DUNGEON MAP</strong><button id="map-close" type="button">CLOSE</button></header><div id="map"></div><p>● current &nbsp; ○ explored &nbsp; ? unexplored exit</p></dialog>
<script type="module" src="/src/main.ts"></script>
</body></html>
